name: Laboratorio 3 - Pruebas Automatizadas

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

jobs:
  hello-ci:
    name: Hello CI
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Verificar pipeline
        run: echo "Hello CI ejecutado correctamente"
  # ===================================
  # 1. COMPILACION
  # ===================================
      build:
    name: Compilacion
    runs-on: ubuntu-latest
    needs: hello-ci

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Verificar compilacion
        working-directory: app
        run: npm run build


  # ===================================
  # 2. PRUEBAS AUTOMATIZADAS
  # ===================================
  test:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Crear carpetas de reportes
        run: |
          mkdir -p app/reports
          mkdir -p app/coverage

      - name: Ejecutar pruebas
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee reports/test-results.txt

      - name: Quality Gate de cobertura
        working-directory: app
        run: |
          node --test \
          --experimental-test-coverage \
          --test-coverage-lines=90 \
          --test-coverage-branches=80 \
          --test-coverage-functions=90

      - name: Generar cobertura LCOV
        working-directory: app
        run: |
          node --test \
          --experimental-test-coverage \
          --test-reporter=lcov \
          --test-reporter-destination=coverage/lcov.info

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas
          path: app/reports/test-results.txt

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-cobertura
          path: app/coverage/


  # ===================================
  # 3. QUALITY GATE FINAL
  # ===================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Validacion final
        run: |
          echo "================================"
          echo "       QUALITY GATE"
          echo "================================"
          echo "Compilacion: OK"
          echo "Pruebas: OK"
          echo "Cobertura: OK"
          echo "Pipeline aprobado"
          echo "================================"